[package]
name = "straum-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
compio.workspace = true
blake3.workspace = true
crc32c.workspace = true
thiserror.workspace = true
# Block compression and dictionary training. Exact version: compressed
# bytes, and so on-disk sizes, depend on it.
zstd = { version = "=0.14.3", default-features = false, features = ["zdict_builder"] }

[features]
# Deterministic simulation (spike): every file system call and clock read
# goes to the in-memory disk of `straum_store::sim` instead of compio.
sim = []

[dev-dependencies]
proptest.workspace = true
crc32c.workspace = true

[lints]
workspace = true
