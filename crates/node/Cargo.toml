[package]
name = "node"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The runtime driver of the new path: links, sequencer or replica, log on disk (ADR-0008 step 4)"

[lints]
workspace = true

[dependencies]
cluster = { path = "../cluster" }
crc32fast = "1"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
journal = { path = "../journal" }
storage = { path = "../storage" }
transport = { path = "../transport" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tracing = "0.1"

[dev-dependencies]
# A throwaway certificate per test run (D-167 A tests).
rcgen = "0.14"

[[bench]]
name = "cap"
harness = false
