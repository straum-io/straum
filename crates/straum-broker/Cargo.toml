[package]
name = "straum-broker"
version = "0.1.0"
description = "The Straum broker: one shard on one core, over straum-store"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The crate is straum-broker; its one binary is straum-server, so
# `cargo run -p straum-broker` runs it.
[[bin]]
name = "straum-server"
path = "src/main.rs"

[dependencies]
straum-proto = { path = "../straum-proto" }
straum-store = { path = "../straum-store" }
compio = { workspace = true, features = ["net", "time", "signal"] }
crc32c.workspace = true
thiserror.workspace = true

[dev-dependencies]
straum-client = { path = "../straum-client" }
straum-conformance = { path = "../straum-conformance" }

[lints]
workspace = true
