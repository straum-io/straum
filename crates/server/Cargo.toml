[package]
name = "server"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

# The deployed binary keeps the product name; docs and runbooks refer to it.
[[bin]]
name = "straum-server"
path = "src/main.rs"

[dependencies]
node = { path = "../node" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
