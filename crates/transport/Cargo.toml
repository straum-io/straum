[package]
name = "transport"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync"] }
tracing = "0.1"
socket2 = { version = "0.6", features = ["all"] }
# TLS is not something to hand-roll. rustls is pure Rust, memory-safe and
# needs no system OpenSSL; `ring` keeps the build free of cmake and NASM.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
# The certificate parser rustls already uses: node names are read from the
# certificate it verified, never by a second parser (ADR-0010).
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }

[dev-dependencies]
divan = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Generates a throwaway certificate per test run, so no private key is ever
# committed to this repository.
rcgen = "0.14"
# Certificates that expire within a test (D-172 C).
time = "0.3"

[[bench]]
name = "read_buffer"
harness = false
