[package]
name = "transport"
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "rt"] }
tracing = "0.1"
socket2 = { version = "0.6", features = ["all"] }
# TLS is not something to hand-roll. rustls is pure Rust, memory-safe and
# needs no system OpenSSL; `ring` keeps the build free of cmake and NASM.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"

[dev-dependencies]
divan = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Generates a throwaway certificate per test run, so no private key is ever
# committed to this repository.
rcgen = "0.14"

[[bench]]
name = "read_buffer"
harness = false
