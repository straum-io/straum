[package]
name = "e2e"
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dev-dependencies]
replication = { path = "../replication" }
storage = { path = "../storage" }
runtime = { path = "../runtime" }
rumqttc = { version = "0.24", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
bytes = "1"

[[bench]]
name = "loadgen"
harness = false


[[bench]]
name = "survive"
harness = false

[[bench]]
name = "replicate"
harness = false

[[bench]]
name = "connhold"
harness = false
