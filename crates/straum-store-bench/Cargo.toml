[package]
name = "straum-store-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
straum-store = { path = "../straum-store" }
compio.workspace = true
crc32c.workspace = true

# `blocks`: the engine has a block cache (compressed blocks, WAL format 8
# and later). Off, the bench builds against WAL format 7
# (scripts/bench/format7-vs-8.sh).
[features]
default = ["blocks"]
blocks = []

[lints]
workspace = true
