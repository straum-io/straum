[package]
name = "straum-store-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
straum-store = { path = "../straum-store" }
compio.workspace = true
crc32c.workspace = true

# `blocks`: the engine has a block cache (compressed blocks, WAL format 8
# and later). Off, the bench builds against WAL format 7
# (scripts/bench/format7-vs-8.sh).
# `cap`: the engine has `Config::max_block_raw_bytes` and
# `Store::last_commit_timing` (WAL format 10). Off, with `blocks` on, the
# bench builds against the uncapped block format (scripts/bench/block-cap.sh).
# `checkpoint`: the engine has `Store::checkpoint` and its triggers
# (ADR-0014). Off, with `cap` on, the bench builds against `540c887`, the
# block branch before the checkpoint work (scripts/bench/checkpoint.sh).
[features]
default = ["blocks", "cap", "checkpoint"]
blocks = []
cap = ["blocks"]
checkpoint = ["cap"]

[lints]
workspace = true
