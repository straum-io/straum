[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/straum-io/straum"

# compio is pinned to an exact version: the storage engine's I/O calls were
# checked against this release.
[workspace.dependencies]
compio = { version = "=0.19.2", default-features = false, features = ["runtime", "fs", "macros", "io-uring"] }
blake3 = "1"
crc32c = "0.6"
thiserror = "2"
proptest = "1"

# Unsafe policy: docs/architecture/unified-stream.md §4.1, ADR-0002.
# `forbid` everywhere until a crate is exempted under that policy; an
# exempted crate does not inherit this table (ADR-0002 describes its own).
# The other three are inert while nothing is exempt and become binding the
# moment something is.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Frozen build configuration for all performance work. Changing any of these
# values is itself a benchmark variable (section 11).
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

# bench inherits release; only debug info is added, which does not change codegen.
[profile.bench]
debug = "line-tables-only"
