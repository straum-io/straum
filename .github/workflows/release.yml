name: release

# A pushed version tag builds the straum-server image for linux/amd64 and
# linux/arm64 and publishes it to Docker Hub, builds the Debian packages for
# both, and creates the GitHub release with the packages, their checksums and
# provenance (Constitution §12.3: only release versions are published). The
# Launchpad PPA is paused (D-253 A, job ppa). A pull request that touches
# the build builds the amd64 image, both packages and the noble source package,
# without publishing anything.
#
# Needs, in the repository settings:
#   variable DOCKERHUB_NAMESPACE  the Docker Hub user or organization
#   variable LAUNCHPAD_PPA        the PPA as OWNER/NAME (ppa:OWNER/NAME)
#   secrets  DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (an access token with write scope)
#   secret   PPA_GPG_KEY          an armored private key without passphrase,
#                                 registered on the Launchpad account
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - debian/**
      - scripts/ppa.sh
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is on main and names a release
        if: env.PUBLISH == 'true'
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -eu
          [ -n "$NAMESPACE" ] || { echo "release: set the DOCKERHUB_NAMESPACE variable" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "release: $GITHUB_REF_NAME is not on main" >&2; exit 1; }

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE || 'straum' }}/straum
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=straum-server
            org.opencontainers.image.description=Durable event log for one server (experimental, not production-ready)
            org.opencontainers.image.licenses=Apache-2.0

      # ponytail: arm64 builds under QEMU, slow for a Rust workspace; move to
      # native arm64 runners with a manifest merge if release builds get too long.
      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Debian packages for amd64 and arm64, built natively in a Debian 12
  # container so the package needs only libc6 >= 2.34 (Debian 12, Ubuntu
  # 22.04 and newer). A pull request builds them as a check.
  deb:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deb
      - name: Build the package
        env:
          REF: ${{ github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
              # v0.1.0-rc.1 -> 0.1.0~rc.1, which sorts before 0.1.0 in dpkg.
              version="$(printf '%s' "${REF#v}" | tr '-' '~')"
          else
              version="0.0.0~pr${PR}"
          fi
          cargo deb --locked -p straum-broker --deb-version "$version"
          ls -l target/debian/
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  # The GitHub release for a version tag: the packages, their checksums and
  # build provenance. The image is on Docker Hub (job image).
  github-release:
    if: github.event_name == 'push'
    needs: [image, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      # GitHub renames "~" in asset names to "."; rename first so SHA256SUMS
      # names the files as they are downloaded. The package version inside
      # (0.1.0~rc.1) is unchanged.
      - name: Checksums
        working-directory: dist
        run: |
          for f in *~*.deb; do [ -e "$f" ] && mv "$f" "$(printf %s "$f" | tr "~" .)"; done
          sha256sum *.deb | tee SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.deb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/straum
        run: |
          set -eu
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "$TAG" --generate-notes \
            --notes "Experimental, not production-ready. Image: \`docker pull ${IMAGE}:${TAG#v}\` (linux/amd64, linux/arm64). Packages: \`sudo apt install ./straum_<version>_<arch>.deb\`, then set cluster_id and node_id in /etc/straum/straum.conf and \`systemctl enable --now straum\`. The broker listens on loopback only until authentication exists. Verify a package: \`sha256sum -c SHA256SUMS\` or \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`."

  # Ubuntu source packages for the Launchpad PPA, which builds them per series
  # and architecture (scripts/ppa.sh, debian/). A pull request builds the noble
  # source package; the binary build with the network cut off, as Launchpad
  # does, and the upload are off: the workspace needs Rust 1.95 and the
  # newest versioned Rust in Ubuntu is 1.93, so Launchpad cannot build the
  # package; the PPA is paused (D-253 A, straum-dev-plan).
  ppa:
    if: github.event_name == 'pull_request'
    needs: [image, deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy --no-install-recommends dpkg-dev debhelper dput
      - name: Build the source packages
        env:
          REF: ${{ github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          PPA: ${{ vars.LAUNCHPAD_PPA }}
          KEY: ${{ secrets.PPA_GPG_KEY }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
              [ -n "$PPA" ] || { echo "release: set the LAUNCHPAD_PPA variable" >&2; exit 1; }
              [ -n "$KEY" ] || { echo "release: set the PPA_GPG_KEY secret" >&2; exit 1; }
              printf '%s\n' "$KEY" | gpg --batch --import
              scripts/ppa.sh "$(printf '%s' "${REF#v}" | tr '-' '~')" jammy noble resolute
          else
              PPA_UNSIGNED=1 scripts/ppa.sh "0.0.0~pr${PR}" noble
          fi
      - name: Build offline, as Launchpad does
        if: false
        run: |
          set -eu
          cd target/ppa
          dpkg-source -x *.dsc build
          sudo apt-get build-dep -qy ./build
          cd build
          sudo unshare --net dpkg-buildpackage -b -us -uc
          dpkg-deb -I ../straum_*.deb
          dpkg-deb -c ../straum_*.deb
      - name: Upload to the PPA
        if: github.event_name == 'push'
        env:
          PPA: ${{ vars.LAUNCHPAD_PPA }}
        run: dput "ppa:$PPA" target/ppa/*_source.changes
