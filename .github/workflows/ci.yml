name: ci

# The validation of rules.md §17 on every PR and on main. The Linux container
# run of scripts/linux.sh is not needed here: the runner is Linux.
# linux_runtime_uses_io_uring is skipped on the runner, whose kernel and
# seccomp policy for io_uring Straum does not control; the io_uring check is
# scripts/container/linux.sh (crates/straum-store/README.md).
# While crates/ holds no crate, cargo refuses a workspace without members, so
# the cargo steps are skipped and the jobs pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ws
        run: |
          if ls crates/*/Cargo.toml >/dev/null 2>&1; then
            echo "crates=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ws.outputs.crates == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.ws.outputs.crates == 'true'
      - if: steps.ws.outputs.crates == 'true'
        run: cargo fmt --check
      - if: steps.ws.outputs.crates == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Benches are built, not run (D-4).
      - if: steps.ws.outputs.crates == 'true'
        run: cargo test --workspace --all-targets --no-run
      # Long tests are #[ignore = "long: ..."]; a PR runs them at their full
      # iteration counts.
      - if: steps.ws.outputs.crates == 'true'
        run: cargo test --workspace --tests -- --include-ignored --skip linux_runtime_uses_io_uring

  # Line, region and function coverage, reported, not gated (ECO-D-7).
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ws
        run: |
          if ls crates/*/Cargo.toml >/dev/null 2>&1; then
            echo "crates=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ws.outputs.crates == 'true'
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        if: steps.ws.outputs.crates == 'true'
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: steps.ws.outputs.crates == 'true'
      - name: Coverage
        if: steps.ws.outputs.crates == 'true'
        run: |
          {
            echo '```text'
            cargo llvm-cov --workspace --tests --summary-only -- --include-ignored --skip linux_runtime_uses_io_uring | tail -1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The power-loss harness (scripts/power-loss/run.sh) in its --quick mode on
  # every PR (D-242 A). LazyFS runs as the runner's user through fusermount3;
  # nothing is installed beyond the packages below and the pinned LazyFS.
  power-loss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev g++ cmake git pkg-config
      - id: pin
        run: echo "lazyfs=$(sed -n 's/^LAZYFS_PIN=\([0-9a-f]*\).*/\1/p' scripts/power-loss/run.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: lazyfs
        with:
          path: ~/lazyfs
          key: lazyfs-${{ steps.pin.outputs.lazyfs }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.lazyfs.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/dsrhaslab/lazyfs.git ~/lazyfs
          git -C ~/lazyfs checkout ${{ steps.pin.outputs.lazyfs }}
          (cd ~/lazyfs/libs/libpcache && ./build.sh)
          (cd ~/lazyfs/lazyfs && ./build.sh)
      - run: scripts/power-loss/run.sh --quick --out "$RUNNER_TEMP/power-loss"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: power-loss
          path: |
            ${{ runner.temp }}/power-loss/*.txt
            ${{ runner.temp }}/power-loss/*.log
            ${{ runner.temp }}/power-loss/*/pre-recovery
