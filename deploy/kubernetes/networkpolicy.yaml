# The links and the metrics carry no authentication: only Straum pods reach
# the links; metrics and MQTT stay open inside the namespace. Enforced only
# where the network plugin supports NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: straum
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: straum
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: straum
      ports:
        - { port: 7000 }
    - from:
        - podSelector: {}
      ports:
        - { port: 1883 }
        - { port: 9100 }
