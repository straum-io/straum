apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: straum
spec:
  serviceName: straum-headless
  replicas: 3                     # the voters; STRAUM_CLUSTER_PEERS lists all of them
  podManagementPolicy: Parallel   # a node needs a majority to serve; start all at once
  selector:
    matchLabels:
      app.kubernetes.io/name: straum
  template:
    metadata:
      labels:
        app.kubernetes.io/name: straum
    spec:
      # Kubernetes would inject STRAUM_0_PORT and the like for the Services
      # below; the server refuses any unknown STRAUM_* variable (D-104 A).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: straum
          image: straum
          env:
            - name: STRAUM_EXPERIMENTAL_CLUSTER
              value: "1"
            # Addresses beyond loopback are refused without it (D-107).
            # Nothing is authenticated or encrypted: networkpolicy.yaml
            # limits who reaches the links and the metrics.
            - name: STRAUM_CLUSTER_UNAUTHENTICATED_NETWORK
              value: "1"
            - name: STRAUM_CLUSTER_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: STRAUM_CLUSTER_PEERS
              value: "0=10.96.100.10:7000,1=10.96.100.11:7000,2=10.96.100.12:7000"
            - name: STRAUM_CLUSTER_LISTEN
              value: "0.0.0.0:7000"
            - name: STRAUM_CLUSTER_MQTT_LISTEN
              value: "0.0.0.0:1883"
            - name: STRAUM_CLUSTER_METRICS_LISTEN
              value: "0.0.0.0:9100"
            - name: STRAUM_CLUSTER_DATA_DIR
              value: /var/lib/straum
          ports:
            - { name: mqtt, containerPort: 1883 }
            - { name: link, containerPort: 7000 }
            - { name: metrics, containerPort: 9100 }
          readinessProbe:
            tcpSocket: { port: mqtt }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/straum }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
