# MQTT clients: any node accepts them. Metrics: one endpoint per pod through
# the headless service (straum-<n>.straum-headless:9100).
apiVersion: v1
kind: Service
metadata:
  name: straum-mqtt
spec:
  selector:
    app.kubernetes.io/name: straum
  ports:
    - { name: mqtt, port: 1883, targetPort: mqtt }
---
apiVersion: v1
kind: Service
metadata:
  name: straum-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: straum
  ports:
    - { name: metrics, port: 9100, targetPort: metrics }
