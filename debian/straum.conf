# Settings of the Straum broker, read by straum.service as
# straum-server --config /etc/straum/straum.conf. Every key, its default and
# its meaning: crates/straum-broker/README.md ("Configuration"). The broker
# refuses to start until cluster_id and node_id are set; then:
#   systemctl enable --now straum

data_dir = /var/lib/straum

# Written to <data_dir>/identity on the first start; a later start with
# other values is refused.
#cluster_id = prod
#node_id = 1

# Loopback only: the broker refuses any other address until authentication
# exists.
#listen = 127.0.0.1:7171
